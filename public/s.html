<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absen Guru - Urusyn Absen</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <p class="mu">Urusyn Absen</p>
  <h2 id="judul">Memuat...</h2>
  <p class="mu" id="info"></p>

  <form id="form" autocomplete="off" hidden>
    <label for="guru">Nama Anda</label>
    <select id="guru" required><option value="">Pilih nama...</option></select>
    <label for="pin">PIN (6 digit)</label>
    <input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" type="password" required>
    <button class="btn" id="tombol" type="submit">Masuk</button>
    <div class="err" id="pesan" role="alert"></div>
  </form>

  <section id="setuju" hidden>
    <h3 id="judulSetuju"></h3>
    <ul class="poin" id="poinSetuju"></ul>
    <label class="cek"><input id="cek" type="checkbox">Saya telah membaca dan menyetujui.</label>
    <button class="btn" id="tombolSetuju" type="button" disabled>Setuju dan lanjut</button>
    <div class="err" id="pesanSetuju" role="alert"></div>
    <button class="btn o btn-keluar" type="button">Ganti guru / Keluar</button>
  </section>

  <section id="absen" hidden>
    <p class="mu" id="tanggalAbsen"></p>
    <div class="panel">
      <div class="baris-status"><span class="mu">Masuk</span><b id="statusMasuk">-</b></div>
      <div class="baris-status"><span class="mu">Pulang</span><b id="statusPulang">-</b></div>
    </div>
    <p class="mu" id="infoSelfie" hidden>Sekolah ini mewajibkan selfie. Ambil foto dulu sebelum absen.</p>
    <div id="blokSelfie" hidden>
      <label class="btn o" for="inputSelfie">Ambil selfie</label>
      <input id="inputSelfie" type="file" accept="image/*" capture="user" hidden>
      <canvas id="pratinjau" hidden></canvas>
      <p class="mu" id="infoFoto"></p>
    </div>
    <button class="btn" id="btnMasuk" type="button">Absen masuk</button>
    <button class="btn o" id="btnPulang" type="button">Absen pulang</button>
    <div class="err" id="pesanAbsen" role="alert"></div>
    <button class="btn o btn-keluar" type="button">Ganti guru / Keluar</button>
  </section>
</div>
<script src="/s.js"></script>
</body>
</html>
